<!-- ============================================
   REGISTER PAGE
   ============================================ -->
<main class="main-content">
  <div class="container">
    <div class="auth-container">
      <div class="auth-card register-card">
        <!-- Header -->
        <div class="auth-header">
          <div class="auth-logo">🛍️</div>
          <h2>{{t 'auth.register'}}</h2>
          <p>{{t 'auth.registerSubtitle'}}</p>
        </div>

        <!-- Register Form -->
        <form id="registerForm" data-action="register">
          <div class="form-group">
            <label class="form-label">{{t 'auth.name'}} <span class="required">*</span></label>
            <div class="input-icon">
              <span class="icon"><i class="fas fa-user"></i></span>
              <input 
                type="text" 
                class="form-control" 
                name="name" 
                placeholder="{{t 'auth.namePlaceholder'}}"
                required
              />
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">{{t 'auth.email'}} <span class="required">*</span></label>
            <div class="input-icon">
              <span class="icon"><i class="fas fa-envelope"></i></span>
              <input 
                type="email" 
                class="form-control" 
                name="email" 
                placeholder="{{t 'auth.emailPlaceholder'}}"
                required
              />
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">{{t 'auth.phone'}}</label>
            <div class="input-icon">
              <span class="icon"><i class="fas fa-phone"></i></span>
              <input 
                type="tel" 
                class="form-control" 
                name="phone" 
                placeholder="{{t 'auth.phonePlaceholder'}}"
              />
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">{{t 'auth.password'}} <span class="required">*</span></label>
            <div class="input-icon">
              <span class="icon"><i class="fas fa-lock"></i></span>
              <input 
                type="password" 
                class="form-control" 
                id="registerPassword"
                name="password" 
                placeholder="{{t 'auth.passwordPlaceholder'}}"
                required
                minlength="8"
              />
              <button type="button" class="icon icon-right password-toggle" data-target="registerPassword">
                <i class="fas fa-eye"></i>
              </button>
            </div>
            <!-- Password Requirements -->
            <div class="password-requirements" id="passwordRequirements">
              <div class="requirement" data-requirement="length">
                <span class="check" style="display:none;">✓</span>
                <span class="cross">✗</span>
                {{t 'auth.passwordLength'}}
              </div>
              <div class="requirement" data-requirement="uppercase">
                <span class="check" style="display:none;">✓</span>
                <span class="cross">✗</span>
                {{t 'auth.passwordUppercase'}}
              </div>
              <div class="requirement" data-requirement="lowercase">
                <span class="check" style="display:none;">✓</span>
                <span class="cross">✗</span>
                {{t 'auth.passwordLowercase'}}
              </div>
              <div class="requirement" data-requirement="number">
                <span class="check" style="display:none;">✓</span>
                <span class="cross">✗</span>
                {{t 'auth.passwordNumber'}}
              </div>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">{{t 'auth.confirmPassword'}} <span class="required">*</span></label>
            <div class="input-icon">
              <span class="icon"><i class="fas fa-lock"></i></span>
              <input 
                type="password" 
                class="form-control" 
                name="confirmPassword" 
                placeholder="{{t 'auth.confirmPasswordPlaceholder'}}"
                required
              />
            </div>
          </div>

          <div class="form-group">
            <label class="checkbox-label">
              <input type="checkbox" name="terms" required />
              {{t 'auth.agreeTerms'}}
              <a href="/terms">{{t 'auth.termsLink'}}</a>
              {{t 'auth.and'}}
              <a href="/privacy">{{t 'auth.privacyLink'}}</a>
            </label>
          </div>

          <button type="submit" class="btn-submit">
            {{t 'auth.register'}}
          </button>
        </form>

        <!-- Divider -->
        <div class="auth-divider">
          <span>{{t 'auth.orContinueWith'}}</span>
        </div>

        <!-- Social Login -->
        <div class="social-login">
          <button class="btn-social google" data-provider="google">
            <i class="fab fa-google"></i>
            Google
          </button>
          <button class="btn-social facebook" data-provider="facebook">
            <i class="fab fa-facebook-f"></i>
            Facebook
          </button>
          <button class="btn-social github" data-provider="github">
            <i class="fab fa-github"></i>
            GitHub
          </button>
        </div>

        <!-- Footer -->
        <div class="auth-footer">
          {{t 'auth.haveAccount'}}
          <a href="/login">{{t 'auth.login'}}</a>
        </div>
      </div>
    </div>
  </div>
</main>

<!-- Register CSS -->
<style>
.register-card {
  max-width: 520px;
}

.password-requirements {
  margin-top: var(--spacing-sm);
  font-size: var(--font-size-sm);
  color: var(--gray-600);
}

.password-requirements .requirement {
  display: flex;
  align-items: center;
  gap: var(--spacing-sm);
  padding: var(--spacing-xs) 0;
}

.password-requirements .requirement .check {
  color: var(--success);
}

.password-requirements .requirement .cross {
  color: var(--danger);
}

.password-requirements .requirement.met {
  color: var(--success);
}

.password-requirements .requirement.met .cross {
  display: none;
}

.password-requirements .requirement.met .check {
  display: inline !important;
}

.checkbox-label {
  display: flex;
  align-items: flex-start;
  gap: var(--spacing-sm);
  font-size: var(--font-size-sm);
  cursor: pointer;
  color: var(--gray-600);
}

.checkbox-label input[type="checkbox"] {
  width: 18px;
  height: 18px;
  flex-shrink: 0;
  margin-top: 2px;
  cursor: pointer;
  accent-color: var(--primary-color);
}

.checkbox-label a {
  color: var(--primary-color);
}

.checkbox-label a:hover {
  text-decoration: underline;
}
</style>
