<!-- ============================================
   LOGIN PAGE
   ============================================ -->
<main class="main-content">
  <div class="container">
    <div class="auth-container">
      <div class="auth-card">
        <!-- Header -->
        <div class="auth-header">
          <div class="auth-logo">🛍️</div>
          <h2>{{t 'auth.login'}}</h2>
          <p>{{t 'auth.loginSubtitle'}}</p>
        </div>

        <!-- Login Form -->
        <form id="loginForm" data-action="login">
          <div class="form-group">
            <label class="form-label">{{t 'auth.email'}} <span class="required">*</span></label>
            <div class="input-icon">
              <span class="icon"><i class="fas fa-envelope"></i></span>
              <input 
                type="email" 
                class="form-control" 
                name="email" 
                placeholder="{{t 'auth.emailPlaceholder'}}"
                required
              />
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">{{t 'auth.password'}} <span class="required">*</span></label>
            <div class="input-icon">
              <span class="icon"><i class="fas fa-lock"></i></span>
              <input 
                type="password" 
                class="form-control" 
                name="password" 
                placeholder="{{t 'auth.passwordPlaceholder'}}"
                required
              />
              <button type="button" class="icon icon-right password-toggle">
                <i class="fas fa-eye"></i>
              </button>
            </div>
          </div>

          <div class="form-options">
            <label class="remember-me">
              <input type="checkbox" name="remember" />
              {{t 'auth.rememberMe'}}
            </label>
            <a href="/forgot-password" class="forgot-link">
              {{t 'auth.forgotPassword'}}
            </a>
          </div>

          <button type="submit" class="btn-submit">
            {{t 'auth.login'}}
          </button>
        </form>

        <!-- Divider -->
        <div class="auth-divider">
          <span>{{t 'auth.orContinueWith'}}</span>
        </div>

        <!-- Social Login -->
        <div class="social-login">
          <button class="btn-social google" data-provider="google">
            <i class="fab fa-google"></i>
            Google
          </button>
          <button class="btn-social facebook" data-provider="facebook">
            <i class="fab fa-facebook-f"></i>
            Facebook
          </button>
          <button class="btn-social github" data-provider="github">
            <i class="fab fa-github"></i>
            GitHub
          </button>
        </div>

        <!-- Footer -->
        <div class="auth-footer">
          {{t 'auth.noAccount'}}
          <a href="/register">{{t 'auth.register'}}</a>
        </div>
      </div>
    </div>
  </div>
</main>

<!-- Login CSS -->
<style>

  min-height: calc(100vh - var(--header-height) - 200px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: var(--spacing-xl) var(--spacing-md);
}

  width: 100%;
  max-width: 440px;
  padding: var(--spacing-xl);

  border-radius: var(--border-radius-lg);

  margin-bottom: var(--spacing-xl);
}

  font-size: var(--font-size-3xl);

}

  margin-bottom: var(--spacing-sm);
}

.auth-header p {
  color: var(--gray-600);
  margin-bottom: 0;
}

}

  padding-left: 2.75rem;
  padding-right: 2.75rem;
}

.input-icon .icon {
  position: absolute;
  left: 1rem;
  top: 50%;
  transform: translateY(-50%);
  color: var(--gray-500);
}

.input-icon .icon-right {
  left: auto;
  right: 1rem;
  cursor: pointer;
  background: none;
  border: none;
  color: var(--gray-500);
  padding: 0;
  font-size: var(--font-size-base);
}

.input-icon .icon-right:hover {
  color: var(--gray-700);
}

.btn-submit {
  width: 100%;
  padding: 0.875rem;
  font-size: var(--font-size-lg);
  font-weight: 600;
  border-radius: var(--border-radius-md);
  background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));

}

.social-login .btn-social {

  align-items: center;
  justify-content: center;
  gap: var(--spacing-sm);
  padding: 0.75rem;
  border: 1px solid var(--gray-300);
  border-radius: var(--border-radius-md);
  background: var(--white);
  color: var(--gray-700);
  font-weight: 500;
  cursor: pointer;
  transition: all var(--transition-fast);
}

.social-login .btn-social:hover {
  background: var(--gray-50);
  border-color: var(--gray-400);
}

.social-login .btn-social.google:hover {
  border-color: #ea4335;
  color: #ea4335;
}

.social-login .btn-social.facebook:hover {
  border-color: #1877f2;
  color: #1877f2;
}

.social-login .btn-social.github:hover {
  border-color: #333;
  color: #333;
}

  font-size: var(--font-size-lg);

  text-align: center;
  color: var(--gray-600);
  font-size: var(--font-size-sm);
}

.auth-footer a {
  color: var(--primary-color);
  font-weight: 500;
}

.auth-footer a:hover {
  text-decoration: underline;
}

@media (max-width: 576px) {
  .auth-card {
    padding: var(--spacing-lg);
  }

  .social-login {
    flex-direction: column;
  }
}
</style>
