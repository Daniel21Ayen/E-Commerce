<!-- frontend/index.html - Make sure you have this structure -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>E-Shop - Modern E-Commerce</title>
    
    <!-- Font Awesome - Backup CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
</head>
<body>
    <div id="app">
        <header id="main-header"></header>
        <main id="main-content">
            <div class="container" id="page-container">
                <div id="page-content">
                    <div class="loading-container">
                        <div class="spinner"></div>
                        <p>Loading...</p>
                    </div>
                </div>
            </div>
        </main>
        <footer id="main-footer"></footer>
        <div id="global-loading" class="loading-overlay" style="display:none;">
            <div class="spinner"></div>
        </div>
        <div id="notification-container"></div>
        <button id="back-to-top" class="back-to-top" style="display:none;">
            <i class="fas fa-arrow-up"></i>
        </button>
    </div>
    <script type="module" src="/src/js/main.js"></script>
</body>
</html>
